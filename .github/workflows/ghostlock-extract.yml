name: GhostLock Kernel Offset Extraction

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'boot.img 的下载直链（GitHub Release 链接）'
        required: true
        default: 'https://github.com/Jie-Zhou-Zhi/my-test/releases/download/v1.0/boot.img'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip python3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download boot.img
        run: |
          curl -L -o boot.img "${{ github.event.inputs.boot_img_url }}"
          ls -lh boot.img
          file boot.img

      - name: Clone ghostlock-app tools
        run: |
          git clone https://github.com/YuKongA/ghostlock-app.git
          cd ghostlock-app
          git submodule update --init --recursive

      - name: Build and Locate extract_rs
        run: |
          EXTRACT_DIR="$GITHUB_WORKSPACE/ghostlock-app/tools/extract_rs"
          cd "$EXTRACT_DIR"
          cargo build --release

          echo "===== 全盘搜索可执行文件 (排除 .git) ====="
          find "$GITHUB_WORKSPACE" -type f -perm -u+x ! -path "*/.git/*" 2>/dev/null | head -100
          echo "=========================================="

          echo "===== CARGO_TARGET_DIR ====="
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          echo "============================"

          echo "===== 搜索名为 ghostlock-extract 或 extract_rs 的文件 ====="
          find "$GITHUB_WORKSPACE" -type f \( -name "ghostlock-extract" -o -name "extract_rs" -o -name "payload-extract" \) ! -path "*/.git/*" 2>/dev/null
          echo "==========================================================="
